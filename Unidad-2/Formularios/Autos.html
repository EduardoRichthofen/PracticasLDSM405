<!DOCTYPE html>

        <meta charset="utf-8">

    <body>
        <h1>AUTOS</h1>
        <section class="contenedor-principal">
            <main class="contenido-principal">
                <fieldset class="formulario-autos">
                    <legend>Datos del auto: </legend>
                    <section class="grupo-campo">
                        <label>Modelo: </label>
                        <input type="text" id="nombre_auto">
                    </section>
                    <section class="grupo-campo">
                        <label>Color: </label>
                        <input type="color" id="color_auto">
                    </section>
                    <section class="grupo-campo">
                        <label>Foto:</label>
                        <input type="file" id="imagen_auto">
                    </section>
                    <section class="grupo-campo opciones-activo">
                        <label>Activo:</label>
                        <section class="opciones-radio">
                            <label><input type="radio" name="activo" id="activo_s" value="SI"> SI</label>
                            <label><input type="radio" name="activo" id="activo_n" value="NO"> NO</label>
                        </section>
                    </section>
                </fieldset>
            </main>
            <aside class="menu-lateral">

            </aside>
        </section>
        <footer class="pie-pagina">

        </footer>
        <script src="JS/Guardar_Autos.js"></script>
